# Render Blueprint — FREE TRIAL of «منارة المعرفة» (the app lives in manara/).
# Deploy: https://render.com/deploy?repo=https://github.com/salehhezam1994-ops/salah-attendance
#
# Trial limits (Render free plan):
#  - declared demo mode: generic placeholder content, no AI key needed, no cost;
#  - no persistent disk: accounts and journeys are erased whenever the service restarts;
#  - the service sleeps after ~15 min idle, so the first visit after that takes about a minute.
# For real use switch to manara/render.paid.yaml (persistent disk + ANTHROPIC_API_KEY).
services:
  - type: web
    name: manara-trial
    runtime: node
    rootDir: manara
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: MANARA_AI
        value: demo
      - key: DATA_DIR
        value: /tmp/manara-data
