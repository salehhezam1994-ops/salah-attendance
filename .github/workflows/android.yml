name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK (runner has Android SDK preinstalled)
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: salah-attendance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release (direct phone download)
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk salah-attendance.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" salah-attendance.apk --title "الإصدار $TAG" --notes "ملف APK لتطبيق متابعة حضور الصلاة" --latest
        env:
          GH_TOKEN: ${{ github.token }}
